<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#111318">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<title>הפודקאסטים שלי</title>
<style>
  :root{
    --bg:#111318; --card:#1b1e26; --card2:#232733; --text:#f2f3f5; --muted:#9aa0ad;
    --accent:#ff3b4e; --accent2:#ff6b5a; --ok:#2fbf71; --line:#2c3040;
  }
  *{box-sizing:border-box}
  html,body{margin:0;background:var(--bg);color:var(--text);
    font-family:system-ui,-apple-system,"Segoe UI",Rubik,Arial,sans-serif;-webkit-tap-highlight-color:transparent}
  body{padding:0 16px calc(24px + env(safe-area-inset-bottom));max-width:720px;margin:0 auto}
  header{display:flex;align-items:center;justify-content:space-between;padding:18px 0 10px}
  h1{font-size:24px;margin:0}
  .icon-btn{background:var(--card);border:1px solid var(--line);color:var(--text);width:44px;height:44px;border-radius:12px;font-size:20px}
  #addForm{display:flex;gap:8px;margin-bottom:12px}
  #urlInput{flex:1;min-width:0;background:var(--card);border:1px solid var(--line);color:var(--text);
    border-radius:12px;padding:12px;font-size:16px;direction:ltr;text-align:right}
  #urlInput::placeholder{color:var(--muted)}
  .btn{border:0;border-radius:12px;padding:12px 16px;font-size:16px;font-weight:600;cursor:pointer}
  .btn-primary{background:var(--accent);color:#fff}
  .tabs{display:flex;gap:8px;margin:4px 0 10px}
  .tabs button{flex:1;background:var(--card);color:var(--muted);border:1px solid var(--line);border-radius:12px;padding:10px;font-size:16px;font-weight:600}
  .tabs button.active{background:var(--card2);color:var(--text);border-color:var(--accent)}
  .chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:6px;margin-bottom:6px;scrollbar-width:none}
  .chips::-webkit-scrollbar{display:none}
  .chip{flex:none;background:var(--card);color:var(--muted);border:1px solid var(--line);border-radius:999px;padding:8px 14px;font-size:14px;white-space:nowrap}
  .chip.active{background:var(--text);color:var(--bg);border-color:var(--text)}
  #surprise{width:100%;margin:6px 0 14px;background:var(--card2);color:var(--text);border:1px dashed var(--line)}
  .card{background:var(--card);border-radius:16px;overflow:hidden;margin-bottom:14px;border:1px solid var(--line);transition:box-shadow .3s}
  .card.flash{box-shadow:0 0 0 3px var(--accent)}
  .thumb{position:relative;aspect-ratio:16/9;background:#000}
  .thumb img{width:100%;height:100%;object-fit:cover;display:block}
  .dur{position:absolute;bottom:8px;left:8px;background:rgba(0,0,0,.8);padding:3px 8px;border-radius:6px;font-size:13px;direction:ltr}
  .badge{position:absolute;top:8px;right:8px;background:var(--accent2);color:#fff;padding:3px 10px;border-radius:999px;font-size:13px;font-weight:600}
  .meta{padding:12px 14px 4px}
  .meta h2{font-size:17px;line-height:1.35;margin:0 0 4px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
  .meta p{margin:0;color:var(--muted);font-size:14px}
  .actions{display:flex;gap:8px;padding:12px 14px 14px}
  .play{flex:1;display:flex;align-items:center;justify-content:center;gap:8px;background:var(--accent);color:#fff;
    text-decoration:none;border-radius:12px;padding:14px;font-size:18px;font-weight:700}
  .sec{background:var(--card2);color:var(--text);border:1px solid var(--line);border-radius:12px;padding:0 14px;font-size:15px;font-weight:600;min-width:52px}
  .sec.ok{color:var(--ok)}
  .empty{text-align:center;color:var(--muted);padding:40px 10px;line-height:1.7}
  #toast{position:fixed;bottom:calc(20px + env(safe-area-inset-bottom));left:50%;transform:translateX(-50%) translateY(120px);
    background:var(--text);color:var(--bg);padding:12px 18px;border-radius:12px;font-weight:600;transition:transform .25s;z-index:10;max-width:90vw;text-align:center}
  #toast.show{transform:translateX(-50%) translateY(0)}
  dialog{background:var(--card);color:var(--text);border:1px solid var(--line);border-radius:16px;width:min(92vw,480px);padding:20px}
  dialog::backdrop{background:rgba(0,0,0,.6)}
  dialog h3{margin:0 0 12px}
  dialog label{display:block;font-size:14px;color:var(--muted);margin:14px 0 6px;line-height:1.5}
  dialog input[type=text]{width:100%;background:var(--bg);border:1px solid var(--line);color:var(--text);border-radius:10px;padding:10px;font-size:15px;direction:ltr}
  .row{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
  .row .btn{background:var(--card2);color:var(--text);border:1px solid var(--line);font-size:15px}
</style>
</head>
<body>
<header>
  <h1>מה שומעים?</h1>
  <button class="icon-btn" id="settingsBtn" aria-label="הגדרות">⚙︎</button>
</header>

<form id="addForm">
  <input id="urlInput" type="url" placeholder="הדבק קישור מיוטיוב" autocomplete="off">
  <button class="btn btn-primary" type="submit">הוסף</button>
</form>

<nav class="tabs">
  <button data-view="queue" class="active">מחכים <span id="cntQ"></span></button>
  <button data-view="done">שמעתי <span id="cntD"></span></button>
</nav>

<div class="chips" id="lenChips"></div>
<div class="chips" id="chanChips"></div>
<button class="btn" id="surprise">🎲 תבחר לי משהו</button>

<main id="list"></main>
<div id="toast"></div>

<dialog id="settings">
  <h3>הגדרות</h3>
  <label for="apiKey">מפתח YouTube Data API (לא חובה). איתו האפליקציה תציג את אורך כל פרק ותאפשר סינון לפי זמן נסיעה.</label>
  <input type="text" id="apiKey" placeholder="AIza...">
  <div class="row"><button class="btn" id="saveKey">שמור מפתח</button></div>
  <label>גיבוי: הנתונים נשמרים רק בטלפון הזה. אפשר להוריד קובץ גיבוי ולשחזר ממנו.</label>
  <div class="row">
    <button class="btn" id="exportBtn">הורד גיבוי</button>
    <button class="btn" id="importBtn">שחזר מגיבוי</button>
    <input type="file" id="importFile" accept="application/json" hidden>
  </div>
  <div class="row" style="margin-top:18px"><button class="btn btn-primary" id="closeSettings">סגור</button></div>
</dialog>

<script>
const STORE = 'podq.items.v1', KEYSTORE = 'podq.apikey';
const $ = s => document.querySelector(s);
const isAndroid = /Android/i.test(navigator.userAgent);

let items = load();
let view = 'queue', chanFilter = null, lenFilter = 'all';

function load(){ try{ return JSON.parse(localStorage.getItem(STORE)) || []; }catch{ return []; } }
function save(){ try{ localStorage.setItem(STORE, JSON.stringify(items)); }catch{} }
function getKey(){ try{ return localStorage.getItem(KEYSTORE) || ''; }catch{ return ''; } }

// ---------- קישורים ----------
function extractId(text){
  if(!text) return null;
  const m = String(text).match(/(?:youtu\.be\/|youtube\.com\/(?:watch\?(?:[^ ]*&)?v=|shorts\/|live\/|embed\/)|music\.youtube\.com\/watch\?(?:[^ ]*&)?v=)([A-Za-z0-9_-]{11})/);
  return m ? m[1] : null;
}
function musicUrl(id){ return 'https://music.youtube.com/watch?v=' + id; }
function playHref(id){
  // באנדרואיד: פתיחה ישירה באפליקציית YouTube Music (ולא ביוטיוב הרגיל)
  if(isAndroid){
    return 'intent://music.youtube.com/watch?v=' + id +
      '#Intent;scheme=https;package=com.google.android.apps.youtube.music;' +
      'S.browser_fallback_url=' + encodeURIComponent(musicUrl(id)) + ';end';
  }
  return musicUrl(id);
}

// ---------- נתונים מיוטיוב ----------
async function fetchMeta(id){
  const watch = 'https://www.youtube.com/watch?v=' + id;
  const meta = { title: 'פרק ביוטיוב', channel: '', duration: null };
  const tries = [
    'https://www.youtube.com/oembed?format=json&url=' + encodeURIComponent(watch),
    'https://noembed.com/embed?url=' + encodeURIComponent(watch)
  ];
  for(const u of tries){
    try{
      const r = await fetch(u); if(!r.ok) continue;
      const j = await r.json(); if(!j.title) continue;
      meta.title = j.title; meta.channel = j.author_name || ''; break;
    }catch{}
  }
  const api = await fetchApi([id]);
  if(api[id]) Object.assign(meta, api[id]);
  return meta;
}
function parseIso(d){
  const m = /P(?:(\d+)D)?T?(?:(\d+)H)?(?:(\d+)M)?(?:(\d+)S)?/.exec(d||''); if(!m) return null;
  return (+m[1]||0)*86400 + (+m[2]||0)*3600 + (+m[3]||0)*60 + (+m[4]||0);
}
async function fetchApi(ids){
  const key = getKey(); const out = {};
  if(!key || !ids.length) return out;
  for(let i=0;i<ids.length;i+=50){
    try{
      const r = await fetch('https://www.googleapis.com/youtube/v3/videos?part=snippet,contentDetails&id=' +
        ids.slice(i,i+50).join(',') + '&key=' + encodeURIComponent(key));
      if(!r.ok) continue;
      const j = await r.json();
      for(const v of j.items||[]) out[v.id] = {
        title: v.snippet.title, channel: v.snippet.channelTitle, duration: parseIso(v.contentDetails.duration)
      };
    }catch{}
  }
  return out;
}

// ---------- הוספה ----------
async function addFromText(text){
  const id = extractId(text);
  if(!id){ toast('לא מצאתי סרטון ביוטיוב בקישור הזה'); return; }
  const ex = items.find(x => x.id === id);
  if(ex){
    if(ex.status === 'done'){ ex.status='queue'; ex.doneAt=null; save(); render(); toast('הוחזר לתור'); }
    else toast('כבר נמצא בתור');
    return;
  }
  const it = { id, title:'טוען...', channel:'', duration:null, thumb:'https://i.ytimg.com/vi/'+id+'/hqdefault.jpg',
    addedAt: Date.now(), status:'queue', startedAt:null, doneAt:null };
  items.unshift(it); view='queue'; save(); render();
  Object.assign(it, await fetchMeta(id)); save(); render();
  toast('נוסף לתור ✓');
}

// ---------- תצוגה ----------
const esc = s => String(s||'').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function fmtDur(s){
  if(!s) return '';
  const h=Math.floor(s/3600), m=Math.floor(s%3600/60), sec=s%60;
  return h ? `${h}:${String(m).padStart(2,'0')}:${String(sec).padStart(2,'0')}` : `${m}:${String(sec).padStart(2,'0')}`;
}
const LENS = [['all','הכל'],['20','עד 20 דק\''],['45','עד 45 דק\''],['long','מעל 45 דק\'']];
function lenOk(it){
  if(lenFilter==='all') return true;
  if(!it.duration) return false;
  const min = it.duration/60;
  return lenFilter==='long' ? min>45 : min <= +lenFilter;
}
function visible(){
  return items.filter(x => x.status===view && (!chanFilter || x.channel===chanFilter) && (view!=='queue' || lenOk(x)))
    .sort((a,b) => view==='done' ? (b.doneAt||0)-(a.doneAt||0) : b.addedAt-a.addedAt);
}
function render(){
  const q = items.filter(x=>x.status==='queue'), d = items.filter(x=>x.status==='done');
  $('#cntQ').textContent = q.length ? `(${q.length})` : '';
  $('#cntD').textContent = d.length ? `(${d.length})` : '';
  document.querySelectorAll('.tabs button').forEach(b => b.classList.toggle('active', b.dataset.view===view));

  const pool = view==='queue' ? q : d;
  const hasDur = view==='queue' && q.some(x=>x.duration);
  $('#lenChips').style.display = hasDur ? '' : 'none';
  if(!hasDur) lenFilter='all';
  $('#lenChips').innerHTML = LENS.map(([k,l]) => `<button class="chip ${lenFilter===k?'active':''}" data-len="${k}">${l}</button>`).join('');

  const chans = [...new Set(pool.map(x=>x.channel).filter(Boolean))];
  if(chanFilter && !chans.includes(chanFilter)) chanFilter=null;
  $('#chanChips').style.display = chans.length>1 ? '' : 'none';
  $('#chanChips').innerHTML = `<button class="chip ${!chanFilter?'active':''}" data-chan="">כל הערוצים</button>` +
    chans.map(c => `<button class="chip ${chanFilter===c?'active':''}" data-chan="${esc(c)}">${esc(c)}</button>`).join('');

  $('#surprise').style.display = view==='queue' && q.length>1 ? '' : 'none';

  const list = visible();
  if(!list.length){
    $('#list').innerHTML = `<div class="empty">${view==='queue'
      ? (q.length ? 'אין פרקים שמתאימים לסינון.' : 'התור ריק.<br>ביוטיוב: לחץ "שתף" על פרק ובחר "הפודקאסטים שלי",<br>או הדבק קישור למעלה.')
      : 'עוד לא סימנת פרקים ששמעת.'}</div>`;
    return;
  }
  $('#list').innerHTML = list.map(it => `
    <article class="card" id="c-${it.id}">
      <div class="thumb">
        <img src="${esc(it.thumb)}" alt="" loading="lazy">
        ${it.duration ? `<span class="dur">${fmtDur(it.duration)}</span>` : ''}
        ${it.status==='queue' && it.startedAt ? '<span class="badge">התחלת לשמוע</span>' : ''}
      </div>
      <div class="meta"><h2>${esc(it.title)}</h2><p>${esc(it.channel)}</p></div>
      <div class="actions">
        <a class="play" href="${playHref(it.id)}" data-play="${it.id}">▶ נגן</a>
        ${it.status==='queue'
          ? `<button class="sec ok" data-done="${it.id}" aria-label="שמעתי">✓</button>`
          : `<button class="sec" data-back="${it.id}">לתור</button>`}
        <button class="sec" data-del="${it.id}" aria-label="מחק">🗑</button>
      </div>
    </article>`).join('');
}

let toastT;
function toast(msg){ const t=$('#toast'); t.textContent=msg; t.classList.add('show'); clearTimeout(toastT); toastT=setTimeout(()=>t.classList.remove('show'),2200); }

// ---------- אירועים ----------
$('#addForm').addEventListener('submit', e => { e.preventDefault(); const v=$('#urlInput').value.trim(); $('#urlInput').value=''; addFromText(v); });
document.querySelector('.tabs').addEventListener('click', e => { const b=e.target.closest('button'); if(!b) return; view=b.dataset.view; chanFilter=null; render(); scrollTo(0,0); });
$('#lenChips').addEventListener('click', e => { const b=e.target.closest('[data-len]'); if(!b) return; lenFilter=b.dataset.len; render(); });
$('#chanChips').addEventListener('click', e => { const b=e.target.closest('[data-chan]'); if(!b) return; chanFilter=b.dataset.chan||null; render(); });
$('#surprise').addEventListener('click', () => {
  const l = visible(); if(!l.length) return;
  const pick = l[Math.floor(Math.random()*l.length)];
  const el = document.getElementById('c-'+pick.id);
  el.scrollIntoView({behavior:'smooth',block:'center'}); el.classList.add('flash'); setTimeout(()=>el.classList.remove('flash'),1800);
});
$('#list').addEventListener('click', e => {
  const t = e.target.closest('[data-play],[data-done],[data-back],[data-del]'); if(!t) return;
  const id = t.dataset.play||t.dataset.done||t.dataset.back||t.dataset.del;
  const it = items.find(x=>x.id===id); if(!it) return;
  if(t.dataset.play){ it.startedAt = Date.now(); save(); setTimeout(render,500); return; } // הקישור ממשיך ל-YouTube Music
  if(t.dataset.done){ it.status='done'; it.doneAt=Date.now(); save(); render(); toast('סומן כנשמע ✓'); }
  if(t.dataset.back){ it.status='queue'; it.doneAt=null; save(); render(); toast('הוחזר לתור'); }
  if(t.dataset.del){ if(confirm('למחוק את הפרק מהרשימה?')){ items=items.filter(x=>x.id!==id); save(); render(); } }
});

// הגדרות
$('#settingsBtn').addEventListener('click', () => { $('#apiKey').value=getKey(); $('#settings').showModal(); });
$('#closeSettings').addEventListener('click', () => $('#settings').close());
$('#saveKey').addEventListener('click', async () => {
  try{ localStorage.setItem(KEYSTORE, $('#apiKey').value.trim()); }catch{}
  const missing = items.filter(x=>!x.duration).map(x=>x.id);
  const api = await fetchApi(missing);
  const n = Object.keys(api).length;
  for(const it of items) if(api[it.id]) Object.assign(it, api[it.id]);
  save(); render(); toast(getKey() ? (n ? `עודכנו ${n} פרקים` : 'המפתח נשמר') : 'המפתח הוסר');
});
$('#exportBtn').addEventListener('click', () => {
  const a=document.createElement('a');
  a.href=URL.createObjectURL(new Blob([JSON.stringify(items,null,1)],{type:'application/json'}));
  a.download='podcast-queue-backup.json'; a.click();
});
$('#importBtn').addEventListener('click', () => $('#importFile').click());
$('#importFile').addEventListener('change', async e => {
  const f=e.target.files[0]; if(!f) return;
  try{
    const data=JSON.parse(await f.text()); if(!Array.isArray(data)) throw 0;
    const ids=new Set(items.map(x=>x.id)); let n=0;
    for(const it of data) if(it && it.id && !ids.has(it.id)){ items.push(it); n++; }
    save(); render(); toast(`שוחזרו ${n} פרקים`);
  }catch{ toast('הקובץ לא תקין'); }
  e.target.value='';
});

// ---------- קבלת שיתוף מיוטיוב ----------
(function handleShare(){
  const p = new URLSearchParams(location.search);
  const shared = [p.get('url'),p.get('text'),p.get('title')].filter(Boolean).join(' ');
  if(shared){ history.replaceState(null,'',location.pathname); addFromText(shared); }
})();

render();
if('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(()=>{});
</script>
</body>
</html>
